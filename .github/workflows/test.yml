# 每次 push / PR 都跑一遍：编译（带尺寸闸门）+ 全部测试。
#
# 为什么没有 `forge fmt --check`：本仓库还没有做过一次全量 `forge fmt`，
# 且 src/ 下的文件是 CRLF、新文件是 LF。现在加这道检查会让 CI 从第一天就红，
# 而且红的原因和代码质量无关。要做就单独做一次「全量格式化」提交，再把它加进来。
#
# 工具链版本钉死 v1.5.1，与本地开发环境一致：`forge build --sizes` 的结果、
# 以及部署用的字节码都和本地对得上，不会出现「本地能过 CI 不过」的假差异。

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  forge:
    name: forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.5.1

      # 只缓存 solc 二进制。out/ 与 cache/ 不缓存：编译产物跟源码强绑定，
      # 跨提交复用只会带来「改了代码却用到旧产物」的假绿
      - name: Cache solc
        uses: actions/cache@v4
        with:
          path: ~/.svm
          key: solc-${{ runner.os }}-0.8.24

      # 尺寸闸门：EIP-170 的 24,576 B 是硬上限，超了主网部署不上去。
      # 放在测试之前，超限直接失败，不用等 268 条跑完
      - name: Build (size gate)
        run: forge build --sizes

      - name: Test
        run: forge test -vv

      # lint 只做提示。仓库里现有 14 条 note 是刻意留下的（见 README「静态检查」），
      # 卡成硬失败会让 CI 永远红，反而让人忽略新出现的真问题
      - name: Lint (non-blocking)
        continue-on-error: true
        run: forge lint
